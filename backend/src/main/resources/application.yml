server:
  port: 8080

spring:
  application:
    name: barber-booking-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/barber_saas?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:barber_user}
    password: ${SPRING_DATASOURCE_PASSWORD:barber_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      url: ${SPRING_DATA_REDIS_URL:redis://127.0.0.1:6379}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jackson:
    serialization:
      FAIL_ON_EMPTY_BEANS: false

payment:
  webhook:
    secret: ${PAYMENT_WEBHOOK_SECRET:default_webhook_secret_key}

jwt:
  secret: ${JWT_SECRET:super_secret_jwt_key_for_barber_app_32_bytes_min_length_123456}
  expiration: ${JWT_EXPIRATION_MS:86400000}
