<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="g1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0B0F17" />
    </linearGradient>
    <linearGradient id="g1Gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#g1Bg)" />

  <!-- Ambient Circle -->
  <circle cx="300" cy="180" r="140" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.3" />

  <!-- Detailed Barber Chair Graphic -->
  <g transform="translate(300, 190) scale(1.1)">
    <!-- Base Plate -->
    <ellipse cx="0" cy="90" rx="60" ry="14" fill="#334155" stroke="url(#g1Gold)" stroke-width="2" />
    <!-- Hydraulic Column -->
    <rect x="-10" y="45" width="20" height="45" rx="3" fill="#64748B" />
    <!-- Footrest -->
    <path d="M-40 70 L-60 85 L-20 85 Z" fill="#475569" stroke="url(#g1Gold)" stroke-width="1" />
    <!-- Seat Cushion (Leather) -->
    <rect x="-55" y="20" width="110" height="28" rx="8" fill="#78350F" stroke="url(#g1Gold)" stroke-width="2" />
    <line x1="-55" y1="34" x2="55" y2="34" stroke="#92400E" stroke-width="2" />
    <!-- Armrests -->
    <path d="M-60 10 L-55 25 M60 10 L55 25" stroke="url(#g1Gold)" stroke-width="4" stroke-linecap="round" />
    <!-- Backrest -->
    <rect x="-42" y="-45" width="84" height="60" rx="10" fill="#92400E" stroke="url(#g1Gold)" stroke-width="2.5" />
    <line x1="-42" y1="-15" x2="42" y2="-15" stroke="#78350F" stroke-width="2" />
    <!-- Headrest -->
    <rect x="-24" y="-75" width="48" height="24" rx="6" fill="#78350F" stroke="url(#g1Gold)" stroke-width="2" />
  </g>

  <!-- Frame & Badge -->
  <rect x="12" y="12" width="576" height="376" rx="12" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0.2" />
  <rect x="180" y="325" width="240" height="34" rx="17" fill="#0B0F17" stroke="url(#g1Gold)" stroke-width="1.5" />
  <text x="300" y="347" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="2" text-anchor="middle">VINTAGE LEATHER STATIONS</text>
</svg>
