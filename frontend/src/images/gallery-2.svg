<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="g2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="emeraldGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#g2Bg)" />
  <circle cx="300" cy="180" r="130" fill="#0B132B" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4" />

  <!-- Hot Towel & Straight Razor Vector Graphic -->
  <g transform="translate(300, 180) scale(1.15)">
    <!-- Rolled Hot Towel with Steam Waves -->
    <path d="M-60 20 C-60 0 -20 0 -20 20 L20 20 C20 0 60 0 60 20 L50 45 C50 60 -50 60 -50 45 Z" fill="#E2E8F0" stroke="#10B981" stroke-width="2" />
    <!-- Steam Curves -->
    <path d="M-30 -15 Q-20 -35 -30 -55" stroke="url(#emeraldGold)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8" />
    <path d="M0 -10 Q10 -35 0 -60" stroke="url(#emeraldGold)" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M30 -15 Q40 -35 30 -55" stroke="url(#emeraldGold)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8" />
    <!-- Straight Razor Silhouette -->
    <g transform="translate(0, 65)">
      <rect x="-70" y="0" width="80" height="12" rx="4" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" />
      <path d="M10 0 L75 -15 L70 -5 L10 6 Z" fill="#94A3B8" stroke="#F59E0B" stroke-width="1" />
    </g>
  </g>

  <rect x="12" y="12" width="576" height="376" rx="12" fill="none" stroke="#10B981" stroke-width="1" opacity="0.2" />
  <rect x="160" y="325" width="280" height="34" rx="17" fill="#0B0F17" stroke="url(#emeraldGold)" stroke-width="1.5" />
  <text x="300" y="347" fill="#34D399" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="2" text-anchor="middle">ROYAL HOT TOWEL &amp; STEAM</text>
</svg>
