<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="g3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161E2E" />
      <stop offset="100%" stop-color="#0B0F17" />
    </linearGradient>
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#g3Bg)" />
  <circle cx="300" cy="180" r="130" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.3" />

  <!-- Precision Grooming Tools (Clipper + Beard Oil Dropper + Comb) -->
  <g transform="translate(300, 180) scale(1.1)">
    <!-- Barber Shears Centerpiece -->
    <path d="M-40 -40 L40 40 M40 -40 L-40 40" stroke="url(#amberGold)" stroke-width="6" stroke-linecap="round" />
    <circle cx="-42" cy="-42" r="14" fill="#0B0F17" stroke="url(#amberGold)" stroke-width="4" />
    <circle cx="42" cy="-42" r="14" fill="#0B0F17" stroke="url(#amberGold)" stroke-width="4" />
    <circle cx="0" cy="0" r="4.5" fill="#FFFFFF" />

    <!-- Beard Oil Bottle Dropper -->
    <g transform="translate(90, 10)">
      <rect x="-16" y="0" width="32" height="45" rx="6" fill="#78350F" stroke="url(#amberGold)" stroke-width="1.5" />
      <rect x="-8" y="-12" width="16" height="12" fill="#1E293B" />
      <circle cx="0" cy="-16" r="6" fill="#334155" />
    </g>

    <!-- Carbon Fiber Barber Comb -->
    <g transform="translate(-90, 10)">
      <rect x="-12" y="0" width="24" height="60" rx="4" fill="#1E293B" stroke="url(#amberGold)" stroke-width="1" />
      <line x1="-12" y1="12" x2="6" y2="12" stroke="url(#amberGold)" stroke-width="2" />
      <line x1="-12" y1="20" x2="6" y2="20" stroke="url(#amberGold)" stroke-width="2" />
      <line x1="-12" y1="28" x2="6" y2="28" stroke="url(#amberGold)" stroke-width="2" />
      <line x1="-12" y1="36" x2="6" y2="36" stroke="url(#amberGold)" stroke-width="2" />
      <line x1="-12" y1="44" x2="6" y2="44" stroke="url(#amberGold)" stroke-width="2" />
    </g>
  </g>

  <rect x="12" y="12" width="576" height="376" rx="12" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0.2" />
  <rect x="160" y="325" width="280" height="34" rx="17" fill="#0B0F17" stroke="url(#amberGold)" stroke-width="1.5" />
  <text x="300" y="347" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="2" text-anchor="middle">PRECISION GROOMING TOOLS</text>
</svg>
