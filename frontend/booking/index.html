<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Book Appointment | Barber SaaS</title>
  <meta name="description" content="Lightning-fast mobile booking for premier luxury barbershops and salons across Saudi Arabia." />
  <link rel="icon" type="image/svg+xml" href="../src/images/favicon.svg" />

  <!-- Google Fonts: Inter & IBM Plex Sans Arabic -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS Output & Config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dark: { bg: '#0B0F17', card: '#111827', border: '#1F2937' },
            luxury: { gold: '#F59E0B', goldHover: '#D97706', emerald: '#10B981' }
          },
          fontFamily: {
            sans: ['Inter', 'IBM Plex Sans Arabic', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="../src/css/output.css" />

  <style>
    html {
      scroll-behavior: smooth;
      -webkit-tap-highlight-color: transparent;
    }
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-[#0B0F17] text-slate-100 font-sans antialiased min-h-screen selection:bg-[#F59E0B] selection:text-slate-950 relative overflow-x-hidden pb-28 sm:pb-28">

  <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[600px] sm:w-[900px] h-[400px] bg-gradient-to-b from-[#F59E0B]/10 to-transparent blur-3xl pointer-events-none -z-10"></div>

  <!-- Sticky Mobile-Friendly Header with Hold Timer -->
  <header class="border-b border-slate-800/80 bg-[#0B0F17]/90 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-3 sm:py-4 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <a href="../index.html" class="flex items-center gap-2 text-decoration-none">
          <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-[#F59E0B] to-amber-600 flex items-center justify-center text-slate-950 font-black text-sm shadow-md">
            💈
          </div>
          <span class="font-bold text-sm tracking-tight text-white hidden sm:inline" id="header-brand-name">Barber Booking</span>
        </a>
      </div>

      <!-- Real-Time Slot Hold Countdown Badge (Steps 3-4) -->
      <div id="hold-timer-container" class="hidden items-center gap-1.5 px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-300 font-mono text-xs font-semibold">
        <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
        <span>Hold: </span>
        <span id="hold-timer-display" class="font-bold text-white">05:00</span>
      </div>

      <!-- Quick Phone / Support Trigger -->
      <div>
        <a id="header-salon-phone-link" href="tel:0501234567" class="text-xs font-semibold px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 hover:text-white hover:border-[#F59E0B] transition flex items-center gap-1.5">
          <span>📞</span>
          <span class="hidden sm:inline" id="header-salon-phone-text">Call Salon</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Main Booking App Container -->
  <main id="booking-app" class="max-w-3xl mx-auto px-4 pt-4 sm:pt-6 space-y-4 sm:space-y-6">

    <!-- 6-Step Visual Stepper Bar -->
    <div class="bg-slate-900/80 border border-slate-800/80 rounded-2xl p-2.5 sm:p-4 backdrop-blur-sm shadow-lg">
      <div class="grid grid-cols-6 gap-1 text-center" id="stepper-indicator">
        <div class="step-nav-item cursor-pointer" data-step="0">
          <div class="step-icon w-6 h-6 sm:w-8 sm:h-8 rounded-full flex items-center justify-center font-bold text-[11px] sm:text-xs bg-[#F59E0B] text-slate-950 mx-auto shadow-md">0</div>
          <span class="step-label text-[9px] sm:text-xs font-semibold text-amber-400 block mt-1 truncate">Salon</span>
        </div>

        <div class="step-nav-item cursor-pointer" data-step="1">
          <div class="step-icon w-6 h-6 sm:w-8 sm:h-8 rounded-full flex items-center justify-center font-bold text-[11px] sm:text-xs bg-slate-800 text-slate-400 mx-auto">1</div>
          <span class="step-label text-[9px] sm:text-xs font-medium text-slate-500 block mt-1 truncate">Services</span>
        </div>

        <div class="step-nav-item cursor-pointer" data-step="2">
          <div class="step-icon w-6 h-6 sm:w-8 sm:h-8 rounded-full flex items-center justify-center font-bold text-[11px] sm:text-xs bg-slate-800 text-slate-400 mx-auto">2</div>
          <span class="step-label text-[9px] sm:text-xs font-medium text-slate-500 block mt-1 truncate">Barber</span>
        </div>

        <div class="step-nav-item cursor-pointer" data-step="3">
          <div class="step-icon w-6 h-6 sm:w-8 sm:h-8 rounded-full flex items-center justify-center font-bold text-[11px] sm:text-xs bg-slate-800 text-slate-400 mx-auto">3</div>
          <span class="step-label text-[9px] sm:text-xs font-medium text-slate-500 block mt-1 truncate">Slot</span>
        </div>

        <div class="step-nav-item cursor-pointer" data-step="4">
          <div class="step-icon w-6 h-6 sm:w-8 sm:h-8 rounded-full flex items-center justify-center font-bold text-[11px] sm:text-xs bg-slate-800 text-slate-400 mx-auto">4</div>
          <span class="step-label text-[9px] sm:text-xs font-medium text-slate-500 block mt-1 truncate">Details</span>
        </div>

        <div class="step-nav-item cursor-pointer" data-step="5">
          <div class="step-icon w-6 h-6 sm:w-8 sm:h-8 rounded-full flex items-center justify-center font-bold text-[11px] sm:text-xs bg-slate-800 text-slate-400 mx-auto">5</div>
          <span class="step-label text-[9px] sm:text-xs font-medium text-slate-500 block mt-1 truncate">Receipt</span>
        </div>
      </div>

      <div class="w-full bg-slate-800 h-1 rounded-full mt-2 sm:mt-2.5 overflow-hidden">
        <div id="stepper-overall-progress" class="bg-gradient-to-r from-[#F59E0B] to-emerald-400 h-1 rounded-full transition-all duration-300 w-0"></div>
      </div>
    </div>

    <!-- Dynamic Step Content -->
    <div id="step-content" class="backdrop-blur-md bg-white/[0.03] border border-white/10 rounded-2xl p-4 sm:p-6 shadow-2xl transition-all duration-200">
      <div class="space-y-4 animate-pulse">
        <div class="h-44 bg-slate-800/60 rounded-xl"></div>
        <div class="h-8 bg-slate-800/50 rounded-lg w-1/2"></div>
        <div class="h-4 bg-slate-800/40 rounded w-3/4"></div>
      </div>
    </div>

  </main>

  <script type="module" src="../src/js/booking-stepper.js"></script>
</body>
</html>
