<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | Barber SaaS Portal</title>
  <link rel="icon" type="image/svg+xml" href="./src/images/favicon.svg" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dark: { bg: '#0B0F17', card: '#111827', border: '#1F2937' },
            luxury: { gold: '#F59E0B', goldHover: '#D97706', emerald: '#10B981' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="./src/css/output.css" />
</head>
<body class="bg-[#0B0F17] text-slate-100 font-sans antialiased min-h-screen selection:bg-[#F59E0B] selection:text-slate-950 relative flex items-center justify-center p-4">

  <!-- Glow Background -->
  <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[800px] h-[500px] bg-gradient-to-b from-[#F59E0B]/10 via-[#F59E0B]/5 to-transparent blur-3xl pointer-events-none -z-10"></div>

  <!-- Login Card Container -->
  <div class="w-full max-w-md backdrop-blur-md bg-white/5 border border-white/10 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6">
    
    <!-- Card Header -->
    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-[#F59E0B]/10 border border-[#F59E0B]/30 rounded-2xl text-[#F59E0B] text-2xl font-bold shadow-inner mb-1">
        🔐
      </div>
      <h1 class="text-2xl font-extrabold text-white tracking-tight">Sign In to Platform</h1>
      <p class="text-xs text-slate-400">Enter your credentials to access your authority dashboard</p>
    </div>

    <!-- Error Alert Box -->
    <div id="login-error-alert" class="hidden bg-red-500/10 border border-red-500/20 text-red-400 text-xs p-3.5 rounded-xl font-semibold space-y-1">
      <div class="flex items-center gap-2">
        <span>⚠️</span>
        <span id="error-title" class="font-bold">Authentication Failed</span>
      </div>
      <p id="error-desc" class="text-[11px] text-red-300/80 font-normal">Invalid email or password. Please try again.</p>
    </div>

    <!-- Login Form -->
    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Email / Username / Phone</label>
        <input type="text" id="email" required placeholder="admin@barberapp.sa or owner@goldenscissors.sa" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-[#F59E0B] font-mono tracking-wide" />
      </div>

      <div>
        <div class="flex items-center justify-between mb-1">
          <label class="block text-xs font-semibold text-slate-300">Password</label>
          <a href="#" class="text-[11px] text-[#F59E0B] hover:underline">Forgot password?</a>
        </div>
        <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-[#F59E0B]" />
      </div>

      <div class="flex items-center justify-between pt-1">
        <label class="flex items-center gap-2 cursor-pointer select-none">
          <input type="checkbox" id="remember-me" checked class="w-4 h-4 accent-[#F59E0B] rounded bg-slate-900 border-slate-700" />
          <span class="text-xs text-slate-400">Remember Me</span>
        </label>
      </div>

      <button type="submit" id="submit-btn" class="w-full py-3 bg-[#F59E0B] hover:bg-[#D97706] text-slate-950 font-extrabold text-xs rounded-xl transition shadow-lg shadow-[#F59E0B]/20 flex items-center justify-center gap-2">
        <span id="btn-text">Sign In</span>
        <span id="btn-spinner" class="hidden w-4 h-4 border-2 border-slate-950 border-t-transparent rounded-full animate-spin"></span>
      </button>
    </form>

    <!-- Seed Demo Logins -->
    <div class="pt-4 border-t border-slate-800 space-y-3">
      <span class="text-[10px] text-slate-500 uppercase tracking-widest font-bold block text-center">Quick Seed Credentials</span>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-[10px]">
        <button class="seed-btn p-2 bg-slate-900 hover:bg-slate-800 border border-slate-700 hover:border-[#F59E0B] text-slate-300 rounded-xl font-bold transition text-center" data-email="admin@barberapp.sa" data-pass="Admin123!">
          👑 Super Admin
        </button>
        <button class="seed-btn p-2 bg-slate-900 hover:bg-slate-800 border border-slate-700 hover:border-[#F59E0B] text-slate-300 rounded-xl font-bold transition text-center" data-email="owner@goldenscissors.sa" data-pass="Owner123!">
          💈 Salon Owner
        </button>
        <button class="seed-btn p-2 bg-slate-900 hover:bg-slate-800 border border-slate-700 hover:border-[#38BDF8] text-slate-300 rounded-xl font-bold transition text-center" data-email="staff@goldenscissors.sa" data-pass="Staff123!">
          ✂️ Staff Barber
        </button>
        <button class="seed-btn p-2 bg-slate-900 hover:bg-slate-800 border border-slate-700 hover:border-[#F59E0B] text-slate-300 rounded-xl font-bold transition text-center" data-email="owner@royallounge.sa" data-pass="Owner123!">
          🏨 Salon 2 Owner
        </button>
      </div>
    </div>

    <!-- Register Salon Link -->
    <div class="text-center pt-2">
      <a href="./register.html" class="text-xs text-slate-400 hover:text-[#F59E0B] transition">Register a new Salon & Barber Shop →</a>
    </div>
  </div>

  <script type="module" src="./src/js/login.js"></script>
</body>
</html>
