<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop Owner Schedule | Barber SaaS</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN Fallback + Output -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dark: { bg: '#0B0F17', card: '#111827', border: '#1F2937' },
            luxury: { gold: '#F59E0B', goldHover: '#D97706', emerald: '#10B981' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="../src/css/output.css" />

  <!-- SockJS & STOMP Client libraries for browser -->
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
</head>
<body class="bg-[#0B0F17] text-slate-100 font-sans antialiased min-h-screen selection:bg-[#F59E0B] selection:text-slate-950 relative overflow-x-hidden p-6">

  <!-- Toast Notification Alert -->
  <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Header -->
  <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
    <div>
      <div class="flex items-center gap-3">
        <h1 class="text-2xl font-bold text-white tracking-tight">Golden Scissors - Live Schedule</h1>
        <span id="ws-badge" class="px-3 py-1 rounded-full text-xs font-mono font-bold flex items-center gap-1.5 bg-amber-500/10 text-amber-400 border border-amber-500/20">
          <span id="ws-dot" class="w-2 h-2 rounded-full bg-amber-400"></span>
          <span id="ws-text">Connecting...</span>
        </span>
      </div>
      <p class="text-xs text-slate-400 mt-1">Real-time schedule monitoring, live slot sync, and walk-in reservation panel</p>
    </div>

    <button id="open-walkin-modal" class="px-5 py-2.5 bg-[#F59E0B] hover:bg-[#D97706] text-slate-950 font-bold text-xs rounded-xl transition shadow-lg shadow-[#F59E0B]/20 flex items-center gap-2">
      <span>+ Add Walk-In Customer</span>
    </button>
  </header>

  <!-- Controls / Filters -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 bg-slate-900/80 p-4 rounded-2xl border border-slate-800">
    <div class="flex items-center gap-2">
      <button class="date-tab px-4 py-2 rounded-xl text-xs font-semibold bg-slate-800 text-white border border-slate-700" data-tab="TODAY">Today</button>
      <button class="date-tab px-4 py-2 rounded-xl text-xs font-semibold text-slate-400 hover:text-white" data-tab="TOMORROW">Tomorrow</button>
      <button class="date-tab px-4 py-2 rounded-xl text-xs font-semibold text-slate-400 hover:text-white" data-tab="WEEK">This Week</button>
    </div>

    <div class="flex items-center gap-2">
      <label class="text-xs text-slate-400 font-medium">Barber Filter:</label>
      <select id="barber-filter" class="bg-slate-800 border border-slate-700 text-white rounded-xl px-3 py-1.5 text-xs focus:outline-none focus:border-[#F59E0B]">
        <option value="ALL">All Barbers</option>
        <option value="Ahmed">Ahmed</option>
        <option value="Sami">Sami</option>
        <option value="Tariq">Tariq</option>
      </select>
    </div>
  </div>

  <!-- Timetable Grid Container -->
  <div id="timetable-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    <!-- Rendered dynamically by dashboard.js -->
  </div>

  <!-- Floating Walk-in Modal -->
  <div id="walkin-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-md space-y-4 shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-base font-bold text-white">Manual Walk-In Reservation</h3>
        <button id="close-walkin-modal" class="text-slate-400 hover:text-white text-lg">✕</button>
      </div>

      <form id="walkin-form" class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Customer Name</label>
          <input type="text" id="walkin-name" required placeholder="e.g. Faisal Al-Rashid" class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-[#F59E0B]" />
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Saudi Phone Number (+966)</label>
          <input type="tel" id="walkin-phone" required placeholder="+966 5XXXXXXXX" class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-[#F59E0B]" />
          <p id="phone-error" class="text-[10px] text-red-400 hidden mt-1">Invalid Saudi phone number format (e.g. +966501234567 or 0501234567)</p>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Barber</label>
            <select id="walkin-barber" class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-[#F59E0B]">
              <option value="Ahmed">Ahmed</option>
              <option value="Sami">Sami</option>
              <option value="Tariq">Tariq</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Time Slot</label>
            <select id="walkin-time" class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-[#F59E0B]">
              <option value="09:30 AM">09:30 AM</option>
              <option value="11:00 AM">11:00 AM</option>
              <option value="02:00 PM">02:00 PM</option>
              <option value="04:30 PM">04:30 PM</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Service</label>
          <select id="walkin-service" class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-[#F59E0B]">
            <option value="Haircut & Styling">Haircut & Styling (60 SAR)</option>
            <option value="Beard Trim & Lineup">Beard Trim & Lineup (40 SAR)</option>
            <option value="VIP Full Package">VIP Full Package (110 SAR)</option>
          </select>
        </div>

        <div class="pt-3 flex items-center justify-end gap-2">
          <button type="button" id="cancel-walkin-btn" class="px-4 py-2 bg-slate-800 text-slate-300 font-semibold text-xs rounded-xl hover:bg-slate-700">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-[#F59E0B] text-slate-950 font-bold text-xs rounded-xl hover:bg-[#D97706]">Reserve Slot</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="../src/js/dashboard.js"></script>
</body>
</html>
