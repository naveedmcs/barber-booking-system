<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Access Control...</title>
  <script>
    // Forward directly to Super Admin portal preserving search parameters and setting view=access-control
    const search = window.location.search;
    const separator = search ? (search.includes("view=") ? "" : "&view=access-control") : "?view=access-control";
    window.location.replace("../../dashboard/admin.html" + (search ? search + separator : separator) + "#access-control");
  </script>
</head>
<body style="background:#0B0F17; color:#fff; font-family:sans-serif; display:flex; align-items:center; justify-content:center; height:100vh;">
  <div style="text-align:center;">
    <p style="font-size:18px; font-weight:bold; margin-bottom:8px;">🛡️ Loading Super Admin Access Control & RBAC Console...</p>
    <p style="font-size:12px; color:#94a3b8;">Redirecting to `/dashboard/admin.html?view=access-control`</p>
  </div>
</body>
</html>
